    <rect x="442" y="270" rx="8" width="68" height="14" fill="#2563eb"/><rect x="442" y="296" rx="8" width="145" height="10" fill="#bdcbe0"/><rect x="442" y="320" rx="8" width="112" height="10" fill="#d6e0ed"/>
