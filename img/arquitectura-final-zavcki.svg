    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f2346" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#7f93ad"/></marker>
