  <line x1="650" y1="375" x2="730" y2="375" stroke="#7f93ad" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M990 355 C1035 355,1030 265,1070 265" fill="none" stroke="#7f93ad" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1195" y1="345" x2="1195" y2="395" stroke="#7f93ad" stroke-width="4" marker-end="url(#arrow)"/>

